# mvslovers stack installed with SMP during sysgen.
#
# Every product is pinned to a release so a sysgen build is reproducible.
# sysgen downloads <asset> from the GitHub release v<version> of <repo>
# and refuses it unless its sha256 matches.
#
# Move the pins to the newest releases with
#     ./sysgen.py --update-mvslovers            (all products)
#     ./sysgen.py --update-mvslovers ufsd,httpd (only those)
# then review the diff and commit it.
#
# sha256 comes from the release's SHA256SUMS. Where SHA256SUMS does not
# list the dist (httpd 4.5.1, mvsmf 1.4.1) it was computed from the
# downloaded asset; the line says so.
#
# RAKF is installed from a git clone (generate_release.py), so it is
# pinned to a git tag (ref) instead of a dist asset.

[brexx370]
repo = mvslovers/brexx370
version = 3.1.0
asset = brexx370-3.1.0-dist.tar.gz
sha256 = 8a538d246c2a925a6202ebb1a2d21baed959fbb89175bcdbbc275455228c003a

# BREXX/370 TSO integration usermod (TSO EXEC and implicit calls run REXX),
# step 10. Not a dist: the release carries the library USERMOD.ZMG0001 as a
# TRANSMIT file (sent to MVS and RECEIVEd) and as a zip of the same members
# (sysgen reads the jobs $INSTALL, ZMG01CK and ZMG01AP from it). Both sums
# are from the release's SHA256SUMS.
[zmg0001]
repo = mvslovers/brexx370
version = 3.1.0
xmit = ZMG0001.xmit
xmit-sha256 = d3a0ed8f0c18cbfea6b9bf59a27485e1eb837d8b613cc0172a185020bda7bc64
zip = ZMG0001.zip
zip-sha256 = cb6163afa09a5bc153e3070edf419030de3b456be9e1834b551a6865c7715ba7

